name: Product CI

on:
  push:
    branches: [main, master]
    paths:
      - 'web/**'
      - 'mobile/**'
      - 'packages/**'
      - 'package.json'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'mobile/**'
      - 'packages/**'
      - 'package.json'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

jobs:
  web-unit:
    name: Web unit, lint, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
        env:
          CI: true

      - name: Typecheck and local build
        run: npm run build:local
        env:
          VITE_GOOGLE_CLIENT_ID: ''

      - name: Cloud build
        run: npm run build:cloud
        env:
          VITE_GOOGLE_CLIENT_ID: ''
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}

  web-e2e:
    name: Web e2e smoke
    needs: web-unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Local production build
        run: npm run build:local
        env:
          VITE_GOOGLE_CLIENT_ID: ''

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: E2e smoke tests
        run: npm run test:e2e
        env:
          CI: true
          VITE_GOOGLE_CLIENT_ID: ''

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/app/playwright-report/
          retention-days: 7

  web-api:
    name: Web API test and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prove domain package is in the deploy context
        run: npm run verify:deploy

      - name: Test API boundaries
        run: npm run test:api
        env:
          CI: true

      - name: Typecheck API
        run: npm run typecheck:api

      - name: Staging cloud lifecycle
        run: npm run test:staging
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}

  mobile-unit:
    name: Mobile typecheck, unit, and migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and migration tests
        run: npm test
        env:
          CI: true
